<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hippie Folk — Vintage Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/bilgres" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      :root {
        --bg: #f45f62;
        --bg-soft: #f9d85d;
        --panel: #e9d7ba;
        --panel-deep: #f5e7d2;
        --line: #1d1d1d;
        --text: #1d1d1d;
        --muted: #5b3b24;
        --pink: #f4bfd1;
        --yellow: #f7d84a;
        --green: #8ec7a1;
        --orange: #f4a05d;
        --shadow: #1e1e1e;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'DM Sans', sans-serif;
        background:
          radial-gradient(circle at top left, rgba(255,255,255,0.18), transparent 18%),
          linear-gradient(180deg, #f9746d 0%, #f76d6a 100%);
        color: var(--text);
      }

      .site-header {
        background: transparent;
        border: 0;
        position: static;
        box-shadow: none;
      }

      .nav-wrap {
        max-width: 1280px;
        margin: 0 auto;
        padding: 18px 28px 0;
      }

      .top-nav a {
        color: var(--text);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .brand {
        font-family: 'DM Sans', sans-serif;
        font-weight: 800;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .design-page {
        padding: 18px 24px 48px;
      }

      .page-shell {
        max-width: 1300px;
        margin: 0 auto;
        padding: 0 0 32px;
        position: relative;
      }

      .hippie-stage {
        position: relative;
        background: #e9d7ba;
        border: 5px solid var(--line);
        border-radius: 26px;
        box-shadow: 12px 12px 0 #f5d95b, 18px 18px 0 rgba(29,29,29,0.1);
        padding: 24px 26px 18px;
        overflow: hidden;
      }

      .hippie-stage::before,
      .hippie-stage::after {
        content: "";
        position: absolute;
        inset: auto auto 26px 28px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: rgba(255,255,255,0.55);
        box-shadow: 0 0 0 5px rgba(255,255,255,0.15);
      }

      .hippie-stage::after {
        left: auto;
        right: 28px;
      }

      .tiny-stars {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .tiny-stars::before,
      .tiny-stars::after {
        content: "✦";
        position: absolute;
        font-size: clamp(1.3rem, 2vw, 2rem);
        color: rgba(29, 29, 29, 0.7);
        opacity: 0.8;
      }

      .tiny-stars::before {
        top: 10%; left: 8%;
        transform: rotate(-12deg);
      }

      .tiny-stars::after {
        right: 11%; top: 19%;
      }

      .hippie-banner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding-top: 10px;
        font-family: 'DM Sans', sans-serif;
        text-transform: uppercase;
      }

      .hippie-leaf {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 3px solid var(--line);
        background: rgba(255,255,255,0.18);
        position: relative;
      }

      .hippie-leaf::before,
      .hippie-leaf::after {
        content: "";
        position: absolute;
        inset: 50% auto auto 50%;
        width: 26px;
        height: 3px;
        background: var(--line);
        transform: translate(-50%, -50%) rotate(45deg);
      }

      .hippie-leaf::after {
        transform: translate(-50%, -50%) rotate(-45deg);
      }

      .intro-label {
        font-size: clamp(1.4rem, 2vw, 2.4rem);
        font-weight: 900;
        letter-spacing: 0.06em;
        color: #f1d75d;
        text-shadow: -3px 3px 0 var(--line);
      }

      .top-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(14, 14, 14, 0.96);
        color: #f8f0d8;
        border: 4px solid var(--line);
        border-radius: 999px;
        padding: 10px 18px 8px;
        font-size: 0.85rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin: 18px auto 0;
      }

      .gigantic-word {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 10px 0 0;
        padding: 0 16px;
      }

      .gigantic-word h1 {
        margin: 0;
        font-family: 'Bilgres', 'Arial Black', sans-serif;
        font-size: clamp(6.5rem, 10vw, 18rem);
        line-height: 0.8;
        letter-spacing: -0.08em;
        color: #f5d440;
        text-shadow:
          -8px 10px 0 var(--line),
          -14px 18px 0 rgba(26, 26, 26, 0.18);
        transform: rotate(-1.5deg);
      }

      .gigantic-word .mascot {
        position: absolute;
        left: 50%;
        bottom: -58px;
        transform: translateX(-50%);
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: #f5d440;
        border: 4px solid var(--line);
        box-shadow: 0 0 0 10px rgba(255,255,255,0.12);
      }

      .mascot::before,
      .mascot::after {
        content: "";
        position: absolute;
      }

      .mascot::before {
        width: 150px;
        height: 140px;
        left: 46%;
        top: 54%;
        transform: translate(-50%, -50%);
        background: #f5d440;
        border-radius: 50%;
        border: 4px solid var(--line);
      }

      .mascot .eye {
        position: absolute;
        width: 22px;
        height: 24px;
        top: 44%;
        background: #111;
        border-radius: 50%;
        z-index: 2;
      }

      .mascot .eye.left { left: 36%; }
      .mascot .eye.right { right: 36%; }

      .mascot .smile {
        position: absolute;
        left: 50%;
        top: 60%;
        width: 48px;
        height: 26px;
        transform: translateX(-50%);
        border-bottom: 5px solid #111;
        border-radius: 0 0 40px 40px;
      }

      .mascot .arm {
        position: absolute;
        width: 58px;
        height: 18px;
        background: #111;
        border-radius: 18px;
        top: 58%;
        left: -16px;
        transform: rotate(34deg);
      }

      .mascot .arm.right {
        left: auto;
        right: -14px;
        transform: rotate(-34deg);
      }

      .mascot .leg {
        position: absolute;
        width: 76px;
        height: 24px;
        background: #111;
        border-radius: 24px;
        bottom: -16px;
        left: 28%;
        transform: rotate(12deg);
      }

      .mascot .leg.right {
        left: auto;
        right: 28%;
        transform: rotate(-12deg);
      }

      .hippie-meta {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: end;
        gap: 34px;
        padding: 120px 20px 10px;
      }

      .meta-copy {
        font-weight: 800;
        font-size: clamp(1.05rem, 1.2vw, 1.5rem);
        text-transform: uppercase;
        line-height: 1.1;
        max-width: 220px;
      }

      .meta-copy strong {
        font-size: 1.02em;
      }

      .meta-copy.right {
        text-align: right;
        justify-self: end;
      }

      .mushroom-scene {
        position: relative;
        display: flex;
        align-items: end;
        justify-content: space-between;
        padding: 20px 0 0;
      }

      .mushroom {
        position: relative;
        width: 120px;
        height: 230px;
      }

      .mushroom .cap {
        position: absolute;
        bottom: 76px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 55px;
        border-radius: 52% 48% 50% 50% / 78% 72% 28% 22%;
        background: linear-gradient(180deg, #f5d887 0%, #e2af64 100%);
        border: 4px solid var(--line);
      }

      .mushroom .stalk {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 42px;
        height: 92px;
        background: #efd7a4;
        border: 4px solid var(--line);
        border-radius: 18px 18px 8px 8px;
      }

      .mushroom.green .cap {
        background: linear-gradient(180deg, #7dceb1 0%, #53a98e 100%);
      }

      .mushroom.green .stalk { background: #dfe9d6; }

      .bottom-tag {
        text-align: center;
        font-family: 'Bilgres', 'Arial Black', sans-serif;
        font-size: clamp(1.8rem, 2.3vw, 3rem);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 26px 12px 10px;
        color: #f5d440;
        text-shadow: -4px 4px 0 var(--line);
      }

      .back-link {
        position: absolute;
        top: 18px;
        left: 24px;
        z-index: 2;
      }

      @media (max-width: 900px) {
        .hippie-meta { grid-template-columns: 1fr; text-align: center; }
        .meta-copy, .meta-copy.right { justify-self: center; text-align: center; max-width: none; }
        .gigantic-word { margin-top: 32px; }
        .gigantic-word .mascot { bottom: -10px; }
      }

      @media (max-width: 600px) {
        .hippie-stage { padding: 14px 12px 12px; }
        .top-badge { margin-top: 8px; }
        .gigantic-word h1 { font-size: clamp(4rem, 24vw, 8rem); }
        .gigantic-word .mascot { width: 150px; height: 150px; }
        .mushroom { transform: scale(0.8); }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="../index.html" class="brand">Vintage Archive</a>
        <nav class="top-nav">
          <a href="../index.html">Gallery</a>
          <a href="../index.html#about">About</a>
        </nav>
      </div>
    </header>

    <main class="design-page">
      <div class="container page-shell">
        <div class="hippie-stage">
          <a class="button ghost back-link" href="../index.html">← Back to gallery</a>
          <div class="tiny-stars"></div>

          <div class="hippie-banner">
            <span class="hippie-leaf"></span>
            <span class="intro-label">Introducing</span>
            <span class="hippie-leaf"></span>
          </div>

          <div class="top-badge">Zarma Type</div>

          <div class="gigantic-word">
            <h1>BILGRES</h1>
            <div class="mascot" aria-label="Bilgres mascot">
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="smile"></span>
              <span class="arm"></span>
              <span class="arm right"></span>
              <span class="leg"></span>
              <span class="leg right"></span>
            </div>
          </div>

          <div class="hippie-meta">
            <div class="meta-copy">
              <strong>Created by</strong><br />
              Azzam Ridhamalik.<br />
              Bold &amp; Groovy.
            </div>

            <div></div>

            <div class="meta-copy right">
              <strong>Created with</strong><br />
              Passion and love<br />
              in 2023
            </div>
          </div>

          <div class="mushroom-scene">
            <div class="mushroom">
              <span class="cap"></span>
              <span class="stalk"></span>
            </div>
            <div class="mushroom green">
              <span class="cap"></span>
              <span class="stalk"></span>
            </div>
          </div>

          <div class="bottom-tag">Zarma Type Foundry</div>
        </div>
      </div>
    </main>
  </body>
</html>
